<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Flying Dragon</title>
  </head>
  <body>
    <div id="player"></div>
    <div id="field"></div>
    <div id="items-scale" class="scale">
        <div id="items-scale-fill" class="scale-fill"></div>
        <div id="items-scale-text" class="scale-text"></div>
    </div>
    <div id="player-health-scale" class="scale">
        <div id="player-health-scale-fill" class="scale-fill"></div>
        <div id="player-health-scale-text" class="scale-text"></div>
    </div>
    <aside id="game-help" class="game-hint" lang="ru" aria-label="Как играть">
      Собери все 10 кристаллов и избегай врагов. Двигайся стрелками, стреляй пробелом
      или кнопкой «Огонь». Для новой игры обнови страницу.
      <button id="close-game-help" type="button" aria-label="Закрыть подсказку">×</button>
    </aside>
    <aside id="game-over" class="game-hint" lang="ru" role="alert" hidden>
      Твой дракон погиб.<br>
      Чтобы начать заново, обнови страницу<br>
      или нажми кнопку
      <button class="game-restart" type="button">Ещё раз</button>
    </aside>
    <aside id="game-won" class="game-hint" lang="ru" role="status" hidden>
      Ты победил, поздравляю!<br>
      Чтобы начать заново, обнови страницу<br>
      или нажми кнопку
      <button class="game-restart" type="button">Ещё раз</button>
    </aside>
    <nav id="touch-controls" aria-label="Управление драконом" hidden>
      <div class="touch-pad" aria-label="Направление">
        <button class="touch-button touch-up" type="button" data-key="38" aria-label="Вверх">↑</button>
        <button class="touch-button touch-left" type="button" data-key="37" aria-label="Влево">←</button>
        <button class="touch-button touch-right" type="button" data-key="39" aria-label="Вправо">→</button>
        <button class="touch-button touch-down" type="button" data-key="40" aria-label="Вниз">↓</button>
      </div>
      <button class="touch-button touch-fire" type="button" data-key="32" aria-label="Стрелять">Огонь</button>
    </nav>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
